[package]
name = "badgelib"
version = "0.5.3"
edition = "2024"
license = "MIT"
description = "Render customizable SVG badges with gradients, animations, and icons without a hosted service"
homepage = "https://badges.ws"
repository = "https://github.com/vladkens/badgelib"
documentation = "https://docs.rs/badgelib"
readme = "readme.md"
include = ["/src/**", "/scripts/**", "/examples/**", "/LICENSE", "/readme.md"]
keywords = ["badge", "svg", "shields", "status", "readme"]
categories = ["development-tools", "graphics", "value-formatting"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "generate"
path = "scripts/generate.rs"
required-features = ["simple-icons"]

[[example]]
name = "update-icons"
path = "scripts/update-icons.rs"

[[example]]
name = "update-widths"
path = "scripts/update-widths.rs"

[features]
default = []
axum = ["dep:axum-core"]
simple-icons = ["dep:phf"]

[dependencies]
axum-core = { version = "0.5", optional = true }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["now", "wasmbind"] }
phf = { version = "0.14.0", optional = true, features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
axum = { version = "0.8", default-features = false }
rayon = "1.12.0"
skrifa = { version = "0.48.0", default-features = false, features = ["std"] }
