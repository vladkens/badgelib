[package]
name = "badgelib"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "A library for generating badges in Rust"
homepage = "https://badges.ws"
repository = "https://github.com/vladkens/badgelib"
documentation = "https://docs.rs/badgelib"
readme = "readme.md"
include = ["/src/**", "/scripts/**", "/examples/**", "/LICENSE", "/readme.md"]
keywords = ["badge", "svg", "shields", "status", "readme"]
categories = ["development-tools", "graphics", "value-formatting"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "generate"
path = "scripts/generate.rs"
required-features = ["simple-icons"]

[[example]]
name = "update-icons"
path = "scripts/update-icons.rs"

[[example]]
name = "update-widths"
path = "scripts/update-widths.rs"

[features]
default = []
axum = ["dep:axum"]
simple-icons = ["dep:phf"]

[dependencies]
axum = { version = ">=0.8.0", optional = true }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
maud = { version = "0.27.0" }
phf = { version = "0.14.0", features = ["macros"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
rayon = "1.12.0"
rusttype = "0.9.3"
