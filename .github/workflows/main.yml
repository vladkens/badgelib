name: main

# Never pull_request_target or issue_comment: they run PR code with the base branch's rights.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Main runs queue instead, so a release is never cut off; a release commit gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One Linux run: the code is platform-independent.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: make check
      - run: make test

  # The shared release steps (github.com/vladkens/actions): on a `release: vX.Y.Z (#N)` commit
  # `build` checks the version and changelog and runs `cargo publish --dry-run` read-only (beside
  # `test`), then `publish` publishes the crate and creates the tag and the GitHub release.
  # A library has no release files, so no dev pre-release: other pushes publish nothing.
  # `publish` never compiles.
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-build@v1

  publish:
    if: github.ref == 'refs/heads/main' # write rights only for main's own workflow
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: vladkens/actions/rust-publish@v1
        with:
          files: false # a library: no binaries to attach
